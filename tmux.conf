# Orchestrator tmux config — makes tmux invisible as a rendering layer.
# Used exclusively for DEC mode 2026 (synchronized output) support.
# This tmux session is never interacted with directly by the user.

# No status bar
set -g status off

# Disable the prefix key entirely — all keys pass through to the child
set -g prefix None
unbind-key C-b

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-features ",*:RGB"

# Minimal escape time so keystrokes pass through instantly
set -sg escape-time 0

# Generous scrollback for terminal history
set -g history-limit 50000

# Disable mouse handling — let Neovim handle it
set -g mouse off

# Prevent tmux from entering the alternate screen buffer on the client side.
# Without this, Neovim's terminal loses all scrollback because alternate screen
# has no scrollback. Disabling smcup/rmcup keeps output in the normal buffer.
set -ga terminal-overrides ',*:smcup@:rmcup@'
